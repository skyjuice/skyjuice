<svg xmlns="http://www.w3.org/2000/svg" width="500" height="205" viewBox="0 0 500 205" font-family="'Courier New','IBM Plex Mono',Consolas,'Lucida Console',monospace"><rect x="0" y="0" width="500" height="205" rx="6" fill="#0f0a04" stroke="#3a2c10" stroke-width="1"/>
