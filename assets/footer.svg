<svg xmlns="http://www.w3.org/2000/svg" width="800" height="130" viewBox="0 0 800 130" font-family="'Courier New','IBM Plex Mono',Consolas,'Lucida Console',monospace"><rect x="0" y="0" width="800" height="130" rx="6" fill="#1c150a" stroke="#3a2c10" stroke-width="1"/>
<defs>
<linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%" stop-color="#ffb000"/><stop offset="100%" stop-color="#ff6a00"/>
</linearGradient>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
  <rect width="4" height="1.6" fill="#000000" opacity="0.16"/>
</pattern>
<radialGradient id="vig" cx="50%" cy="42%" r="75%">
  <stop offset="55%" stop-color="#000000" stop-opacity="0"/>
  <stop offset="100%" stop-color="#000000" stop-opacity="0.55"/>
</radialGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
  <feGaussianBlur stdDeviation="2.6" result="b"/>
  <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>
<rect x="16" y="16" width="768" height="98" rx="8" fill="#0b0803" stroke="#ffb000" stroke-opacity="0.35" stroke-width="1"/>
<text x="400" y="62" font-size="18" font-weight="700" fill="#ffd27f" text-anchor="middle" filter="url(#glow)">THANKS FOR STOPPING BY</text>
<text x="400" y="92" font-size="12" fill="#b37400" text-anchor="middle">&gt; SESSION CLOSED · NO CARRIER · (C) 2010-2026 SKYJUICE LABS</text>
<rect x="0" y="0" width="800" height="130" fill="url(#scan)"/><rect x="0" y="0" width="800" height="130" fill="url(#vig)"/>
</svg>