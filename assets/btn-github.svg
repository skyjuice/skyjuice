<svg xmlns="http://www.w3.org/2000/svg" width="230" height="40" viewBox="0 0 230 40" font-family="'Courier New','IBM Plex Mono',Consolas,'Lucida Console',monospace"><rect x="0" y="0" width="230" height="40" rx="6" fill="#0f0a04" stroke="#3a2c10" stroke-width="1"/>
